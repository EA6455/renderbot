name: Keep ASTRA6 Alive 24/7

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes - aggressive to prevent sleep
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ASTRA6 Health (primary)
        run: |
          echo "Pinging https://astra6.onrender.com/health"
          curl -s --max-time 30 -o /dev/null -w "%{http_code} %{time_total}s\n" https://astra6.onrender.com/health || true
          curl -s --max-time 30 https://astra6.onrender.com/health | head -c 300 || true
          echo ""
      - name: Ping Status + Home
        run: |
          curl -s --max-time 30 -o /dev/null -w "home: %{http_code} %{time_total}s\n" https://astra6.onrender.com/ || true
          curl -s --max-time 30 -o /dev/null -w "status: %{http_code}\n" https://astra6.onrender.com/api/status || true
      - name: Ping with retry - wake up if sleeping
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s --max-time 60 -o /dev/null -w "%{http_code}" https://astra6.onrender.com/health || echo "000")
            echo "Attempt $i: $CODE at $(date)"
            if [ "$CODE" = "200" ]; then echo "✅ Alive"; exit 0; fi
            echo "Sleeping, retry in 15s..."
            sleep 15
          done
          echo "❌ Still down after 5 attempts"
