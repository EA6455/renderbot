services:
  - type: web
    name: astra6
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_ENVIRONMENT
        value: practice
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_USER
        value: astra6render@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: EMAIL_WEBHOOK_URL
        sync: false
